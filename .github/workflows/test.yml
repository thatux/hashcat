# Fork-only validation covers every container mode with both cost selections.
name: test
run-name: 'All 93 container modes: reduced and full costs'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Plan all container modes
        id: plan
        run: |
          matrix=$(python3 tools/ci_container_validation.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Build once for all jobs
        # Shared artifacts must run on runners with different CPU instruction sets.
        run: make -j2 MARCH_NATIVE='-march=x86-64 -mtune=generic'
      - name: Package build
        run: tar -czf container-build.tar.gz hashcat libhashcat.so* modules/*.so bridges/*.so feeds/*.so
      - uses: actions/upload-artifact@v6
        with:
          name: container-build
          path: container-build.tar.gz
          retention-days: 7

  containers:
    needs: build
    name: '${{ matrix.kind }} m${{ matrix.mode }} (${{ matrix.cost }})'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    env:
      PYTHONUNBUFFERED: '1'
      NO_NON_ASCII: '1'
      CONTAINER_MODE: ${{ matrix.mode }}
      CONTAINER_COST: ${{ matrix.cost }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: container-build
      - name: Restore build
        run: tar -xzf container-build.tar.gz
      - name: Install creators and CPU OpenCL
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            intel-oneapi-runtime-opencl ocl-icd-libopencl1 clinfo \
            cryptsetup-bin dmsetup e2fsprogs tcplay expect libfuse2t64
          sudo modprobe dm_crypt
          sudo modprobe loop
          clinfo -l
      - name: Install VeraCrypt creators
        if: matrix.family == 'veracrypt' && matrix.kind == 'generated'
        run: |
          curl --fail --location --retry 3 \
            https://github.com/veracrypt/VeraCrypt/releases/download/VeraCrypt_1.26.24/veracrypt-console-1.26.24-Ubuntu-24.04-amd64.deb \
            --output veracrypt-console.deb
          echo '0da064cde572ece5316368e7dca84c4c8cc8b7327da921c48187998b8725d4a2  veracrypt-console.deb' | sha256sum --check
          sudo apt-get install -y --no-install-recommends ./veracrypt-console.deb
          veracrypt --version
          if [ '${{ matrix.prf }}' = ripemd160 ]; then
            curl --fail --location --retry 3 \
              https://github.com/veracrypt/VeraCrypt/releases/download/VeraCrypt_1.25.9/veracrypt-console-1.25.9-Ubuntu-23.04-amd64.deb \
              --output veracrypt-legacy.deb
            echo '1a0499bf97eb463bf8ebed80ded401a6274fc30a4ed671b9cdeb4b04f289c6dc  veracrypt-legacy.deb' | sha256sum --check
            dpkg-deb -x veracrypt-legacy.deb .ci-veracrypt-legacy
            .ci-veracrypt-legacy/usr/bin/veracrypt --version
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Python dependencies
        run: pip install -r tools/requirements.txt
      - name: Generate or read fixtures, inspect and crack
        run: python3 tools/ci_container_validation.py run
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: 'containers-m${{ matrix.mode }}-${{ matrix.cost }}'
          path: |
            ci-container/
            container-outcome.json
            container-metadata.json
          retention-days: 7
