name: yescrypt cost profile
run-name: yescrypt compile and execution profile

on:
  workflow_dispatch:
    inputs:
      timeout:
        description: Native invocation timeout in seconds
        default: '1800'
      widths:
        description: Vector widths
        default: '1 4'

permissions:
  contents: read

jobs:
  profile:
    name: compiler=${{ matrix.compiler }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        compiler: [default, no-opt, no-vectorizer]
    steps:
      - uses: actions/checkout@v7
      - name: Install the same OpenCL runtime as the slow runs
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends intel-oneapi-runtime-opencl=2026.2.0-863 ocl-icd-libopencl1 clinfo build-essential gdb
          clinfo
          lscpu
      - name: Build locally on each runner
        run: make -j2 hashcat modules/module_00000.so modules/module_36200.so
      - name: Profile cold and warm kernels
        env:
          PROFILE_TIMEOUT: ${{ inputs.timeout }}
          PROFILE_WIDTHS: ${{ inputs.widths }}
          CL_CONFIG_USE_VECTORIZER: ${{ matrix.compiler == 'no-vectorizer' && '0' || '1' }}
          HC_CI_CL_PROFILE: '1'
          HC_CI_CL_NO_OPT: ${{ matrix.compiler == 'no-opt' && '1' || '' }}
        run: |
          if [ -z "$HC_CI_CL_NO_OPT" ]; then unset HC_CI_CL_NO_OPT; fi
          python3 tools/ci_yescrypt_profile.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: yescrypt-${{ matrix.compiler }}
          path: yescrypt-profile/
