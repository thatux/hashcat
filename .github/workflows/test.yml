## Native pytest integration tests run hashcat directly on PoCL CPU devices.
## PR, weekly and manual mode/kind selection is owned by ci_matrix.py.

name: test

# Name a manual run after the kinds it was dispatched with, so the run list shows "test: opt pure
# (all)" rather than a column of identical "test". A schedule or pull request keeps the event name.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('test: {0}{1}{2}{3}({4})',
                inputs.optimized && 'opt ' || '',
                inputs.pure && 'pure ' || '',
                inputs.bridge && 'bridge ' || '',
                inputs.container && 'container ' || '',
                inputs.modes)
      || format('test ({0})', github.event_name) }}

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      modes:
        description: 'Modes to test, "all" or a space separated list'
        default: 'all'
      optimized:
        description: 'Test the optimized kernels'
        type: boolean
        default: true
      pure:
        description: 'Test the pure kernels'
        type: boolean
        default: true
      bridge:
        description: 'Test Python bridge kernels'
        type: boolean
        default: true
      container:
        description: 'Test container files (TrueCrypt/VeraCrypt/LUKS/..)'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'OpenCL/**'
      - 'src/**'
      - 'include/**'
      - 'deps/**'
      - 'Makefile'
      - 'tests/**'
      - 'pytest.ini'
      - 'tools/test_module_runner.*'
      - 'tools/test_bridge.py'
      - 'tools/compute_sanitizer/**'
      - 'tools/asan/gpu_sweep.sh'
      - 'tools/test_modules/**'
      - 'tools/requirements.txt'
      - '.github/workflows/test.yml'
      - '.github/workflows/ci_matrix.py'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest

    outputs:
      run: ${{ steps.plan.outputs.run }}
      matrix: ${{ steps.plan.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          MODES: ${{ inputs.modes }}
          OPTIMIZED: ${{ inputs.optimized }}
          PURE: ${{ inputs.pure }}
          BRIDGE: ${{ inputs.bridge }}
          CONTAINER: ${{ inputs.container }}
        run: |
          # A manual dispatch chooses the kinds with four checkboxes; pass the chosen ones to
          # ci_matrix.py as --kinds so it emits only those matrix jobs. A schedule has no inputs, so
          # the four are empty and the run covers all of them. If a dispatch clears every box, fall
          # back to all four rather than plan an empty run.
          kinds=""
          [ "$OPTIMIZED" = "true" ] && kinds="$kinds opt"
          [ "$PURE" = "true" ]      && kinds="$kinds pure"
          [ "$BRIDGE" = "true" ]    && kinds="$kinds bridge"
          [ "$CONTAINER" = "true" ] && kinds="$kinds container"
          [ -z "$kinds" ] && kinds="opt pure bridge container"
          kinds_arg="--kinds $(echo $kinds | tr ' ' ',')"

          if [ "$EVENT" = "pull_request" ]; then
            python3 .github/workflows/ci_matrix.py test pr "$BASE" | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$MODES" != "all" ]; then
            python3 .github/workflows/ci_matrix.py test list "$MODES" $kinds_arg | tee -a "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ] &&
               [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 7 * 86400 )) ]; then
            echo "no commit on master in the last seven days, nothing new to test"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            python3 .github/workflows/ci_matrix.py test all $kinds_arg | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 90 || 330 }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    name: pytest ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Install PoCL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
               pocl-opencl-icd ocl-icd-libopencl1 clinfo build-essential
          clinfo -l

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Python oracles
        run: pip install -r tools/requirements.txt -r tests/requirements.txt

      # The LUKS containers are a large download tests need, so pull and cache them here. The luks1 set covers 14600
      # and 29511+. The luks2 set covers 34100. The representative job needs both. The
      # tc/vc/cl container sets are checked into the tree, so they need no fetch.

      - name: Restore the luks1 test containers
        id: luks1
        if: contains(matrix.modes, '14600') || contains(matrix.modes, '2951') || contains(matrix.modes, '2952') || contains(matrix.modes, '2953') || contains(matrix.modes, '2954')
        uses: actions/cache/restore@v6
        with:
          path: tools/luks_tests
          key: luks1-tests-v1

      - name: Fetch the luks1 test containers
        if: (contains(matrix.modes, '14600') || contains(matrix.modes, '2951') || contains(matrix.modes, '2952') || contains(matrix.modes, '2953') || contains(matrix.modes, '2954')) && steps.luks1.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/luks_tests
          cd tools/luks_tests
          wget -q https://hashcat.net/misc/example_hashes/hashcat_luks_testfiles.7z
          7z x -y hashcat_luks_testfiles.7z >/dev/null
          rm -f hashcat_luks_testfiles.7z

      - name: Save the luks1 test containers
        if: (contains(matrix.modes, '14600') || contains(matrix.modes, '2951') || contains(matrix.modes, '2952') || contains(matrix.modes, '2953') || contains(matrix.modes, '2954')) && steps.luks1.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tools/luks_tests
          key: luks1-tests-v1

      - name: Restore the luks2 test containers
        id: luks2
        if: contains(matrix.modes, '34100')
        uses: actions/cache/restore@v6
        with:
          path: tools/luks2_tests
          key: luks2-tests-v1

      - name: Fetch the luks2 test containers
        if: (contains(matrix.modes, '34100')) && steps.luks2.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools/luks2_tests
          cd tools/luks2_tests
          wget -q https://hashcat.net/misc/example_hashes/luks2_tests.7z
          7z x -y luks2_tests.7z >/dev/null
          rm -f luks2_tests.7z

      - name: Save the luks2 test containers
        if: (contains(matrix.modes, '34100')) && steps.luks2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: tools/luks2_tests
          key: luks2-tests-v1

      - name: Install the Rust toolchain
        # Mode 74000 is a Rust bridge: its plugin only builds when cargo is present, and the mode
        # skips without it. The crates are edition 2024, which needs cargo 1.85 or newer. Install a
        # toolchain only on a shard that carries 74000, so the bridge builds and the mode runs
        # instead of skipping, without paying the install on every shard.
        if: contains(matrix.modes, '74000')
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.85.0 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build
        run: make -j$(nproc)

      - name: Test framework regression checks
        run: python3 -m pytest tests/framework tests/test_coverage.py

      - name: pytest
        env:
          EVENT: ${{ github.event_name }}
          MODES: ${{ matrix.modes }}
          KIND: ${{ matrix.kind }}
        run: |
          paths=(tests/test_cracking.py tests/test_containers.py tests/test_stdout.py tests/test_coverage.py)
          opts=(--attacks all)
          if [ "$EVENT" = "pull_request" ]; then
            opts+=(--targets single)
          elif [ "$KIND" = "pure" ]; then
            opts+=(--kernels pure)
          elif [ "$KIND" = "bridge" ]; then
            paths=(tests/test_bridge.py tests/test_coverage.py)
          elif [ "$KIND" = "container" ]; then
            paths=(tests/test_containers.py tests/test_coverage.py)
            opts=()
          fi

          python3 -m pytest "${paths[@]}" --hash-modes "$MODES" "${opts[@]}" \
            --device-type cpu --force --require-coverage --seed 12345 \
            --junitxml=pytest-results.xml --artifact-dir=pytest-artifacts

      - name: Test results and failure inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-${{ matrix.name }}
          path: |
            pytest-results.xml
            pytest-artifacts/
          if-no-files-found: error
