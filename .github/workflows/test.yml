name: test
run-name: Confirm yescrypt startup memory and thread limits
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before
            revision: 9e4c60209d1215c998c24155a2c53dd021cb7fc8
          - label: after
            revision: 1741db2f5d4ebfced3c29425a83159be05619a80
    name: yescrypt ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
      - name: Install PoCL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pocl-opencl-icd ocl-icd-libopencl1 clinfo build-essential
          clinfo
      - name: Build
        run: make -j2 modules/module_36100.so modules/module_36200.so hashcat
      - name: Check expected results
        env:
          CASE: ${{ matrix.label }}
          HASHCAT_DEVICE_MEM_LIMIT: '1024'
          HASHCAT_MEMORY: '1'
          HASHCAT_FORCE_NO_INLINE: '1'
          POCL_EXTRA_BUILD_FLAGS: '-cl-opt-disable'
          POCL_MAX_PTHREAD_COUNT: '2'
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shlex
          import subprocess
          import sys

          logs = pathlib.Path('confirmation-logs')
          logs.mkdir()
          vectors = {
              36100: '$y$j9T$oJqQoBLMgF5$77xERSZazujSxPgj6nYmzH5r0O2HelZJUyfW.ta7vxD',
              36200: '$gy$j9T$HtyOX9cwJ2Dh8LlJV8IJ30$ZCSJt69pE/HLXFfIuxukRc2PlNla.tbqJxUHCp/WHVD',
          }
          cases = [(36100, 8)] if os.environ['CASE'] == 'before' else [(36100, 8), (36200, 8), (36100, 4), (36200, 4)]
          failures = 0
          for mode, threads in cases:
              command = ['./hashcat', '-m', str(mode), '-a', '0', '-D', '1', '--force', '--potfile-disable', '--restore-disable', '--logfile-disable', '--self-test-disable', '-T', str(threads), '-u', '2048', vectors[mode]]
              print("printf '%s\\n' 'hashcat' | " + shlex.join(command), flush=True)
              try:
                  result = subprocess.run(command, input='hashcat\n', text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=180)
              except subprocess.TimeoutExpired as error:
                  output = error.stdout or b''
                  if isinstance(output, bytes):
                      output = output.decode(errors='replace')
                  (logs / f'{mode}-T{threads}.log').write_text(output + '\nTIMEOUT\n')
                  print('FAIL: timeout', flush=True)
                  failures += 1
                  continue
              output = result.stdout
              (logs / f'{mode}-T{threads}.log').write_text(output + f'\nrc={result.returncode}\n')
              print(output, flush=True)
              if os.environ['CASE'] == 'before':
                  passed = result.returncode == 252 and 'Not enough allocatable device memory or free host memory for mapping.' in output
              elif threads == 4:
                  passed = result.returncode == 254 and f'--kernel-threads 4 is outside the range 8-8 that hash-type {mode} allows.' in output
              else:
                  passed = result.returncode == 0 and f'{vectors[mode]}:hashcat' in output and 'Status...........: Cracked' in output
              print(f'mode={mode} threads={threads} rc={result.returncode} expected_result={passed}', flush=True)
              failures += not passed
          sys.exit(bool(failures))
          PY
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yescrypt-${{ matrix.label }}
          path: confirmation-logs/
